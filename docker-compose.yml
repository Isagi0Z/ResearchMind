services:
  grobid:
    image: grobid/grobid:0.8.1
    ports:
      - "8070:8070"
    environment:
      - JAVA_OPTS=-Xms512m -Xmx2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      retries: 3
