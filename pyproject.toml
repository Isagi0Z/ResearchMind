[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchmind"
version = "0.1.0"
description = "Scientific paper ingestion pipeline — converts PDFs into structured research objects"
requires-python = ">=3.9"
license = "MIT"

dependencies = [
    # PDF & XML
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    "lxml>=5.0",

    # NLP
    "spacy>=3.7",
    "nltk>=3.8",

    # OCR
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "opencv-python-headless>=4.9",

    # Data & Validation
    "pydantic>=2.5",
    "pyyaml>=6.0",

    # HTTP & External
    "httpx>=0.27",
    "tenacity>=8.2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",

    # LLM
    "google-genai>=1.0",

    # CLI
    "click>=8.1",
    "rich>=13.0",

    # Fuzzy matching
    "rapidfuzz>=3.6",

    # Background jobs
    "celery>=5.4.0",
    "redis>=5.2.0",
]

[project.optional-dependencies]
biomedical = [
    "scispacy>=0.5.4",
]
ocr-surya = [
    "surya-ocr>=0.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
researchmind = "researchmind.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/researchmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Keep all pytest temp/cache artifacts under D:\RM — never use C: paths
basetemp = "D:/RM/.tmp/pytest"
cache_dir = "D:/RM/.cache/pytest"
tmp_path_retention_policy = "failed"
asyncio_mode = "auto"
