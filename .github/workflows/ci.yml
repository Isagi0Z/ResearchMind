name: CI

on:
  push:
    branches: [module5-development, main]
  pull_request:
    branches: [module5-development, main]

env:
  SECRET_KEY: acbd4f8b5a5458f787e29d1a9476b3f725b42ed30e4842cbe084f8b8bc7ca897
  DATABASE_URL: sqlite+aiosqlite:///./test.db
  ENVIRONMENT: testing
  CORS_ORIGINS: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Check Alembic at head
        run: |
          alembic current
          alembic check 2>/dev/null || true

      - name: Run backend tests
        run: python -m pytest backend/api/tests/ -v --tb=short -q

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build
